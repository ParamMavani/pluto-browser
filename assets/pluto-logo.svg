
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="planet" x1="20%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#d7b7ff"></stop>
      <stop offset="35%" stop-color="#8d65f5"></stop>
      <stop offset="70%" stop-color="#4934b5"></stop>
      <stop offset="100%" stop-color="#171b59"></stop>
    </linearGradient>

    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d9ff"></stop>
      <stop offset="35%" stop-color="#b58aff"></stop>
      <stop offset="65%" stop-color="#6b73ff"></stop>
      <stop offset="100%" stop-color="#8deaff"></stop>
    </linearGradient>

    <radialGradient id="surface" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".4"></stop>
      <stop offset="100%" stop-color="#8c6aff" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <clipPath id="planetClip">
      <circle cx="80" cy="80" r="39"></circle>
    </clipPath>
  </defs>

  <!-- Rear orbital ring -->
  <ellipse cx="80" cy="80" rx="68" ry="22" transform="rotate(-24 80 80)" fill="none" stroke="#8c70ff" stroke-width="9" opacity=".7"></ellipse>

  <!-- Planet -->
  <circle cx="80" cy="80" r="39" fill="url(#planet)"></circle>

  <g clip-path="url(#planetClip)">
    <circle cx="80" cy="80" r="39" fill="url(#surface)"></circle>
    <path d="M45 60 Q63 46 81 59 T119 52" fill="none" stroke="#e6d7ff" stroke-opacity=".28" stroke-width="5"></path>
    <path d="M42 93 Q67 76 91 91 T123 85" fill="none" stroke="#c0a7ff" stroke-opacity=".3" stroke-width="7"></path>
    <path d="M55 112 Q79 98 108 110" fill="none" stroke="#171b59" stroke-opacity=".45" stroke-width="8"></path>
  </g>

  <!-- Front orbital ring -->
  <path d="M14 89 C35 104 106 112 145 68" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"></path>

  <path d="M14 89 C35 104 106 112 145 68" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".75"></path>

  <!-- Small cosmic spark -->
  <path d="M126 27 L130 37 L140 41 L130 45 L126 55 L122 45 L112 41 L122 37 Z" fill="#d8c5ff" opacity=".9"></path>
</svg>
